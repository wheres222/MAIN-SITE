name: Security

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Local secret guard scan
        run: python3 scripts/scan-secrets.py

      # gitleaks is invoked directly rather than through gitleaks-action.
      #
      # The action derives a commit range and runs
      #   git log --no-merges --first-parent <first>^..<head>
      # which yields nothing at all when the pushed commit is a merge — the only
      # commit on the first-parent line is the merge itself, and --no-merges
      # drops it. Every run on main therefore reported
      #   "0 commits scanned. scanned ~0 bytes (0)" ... "✅ No leaks detected"
      # and on pull_request the same range failed outright with
      #   "fatal: Invalid revision range", exiting 1 with nothing scanned.
      #
      # So the check was green without ever reading a byte, and red when it
      # errored — never actually about secrets either way.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version

      # The working tree, every run. Deterministic and always scans real bytes:
      # this is what catches a secret sitting in the code right now.
      - name: Gitleaks — working tree
        run: ./gitleaks detect --no-git --source . --config .gitleaks.toml --redact -v --exit-code 1

      # Full history, only on the nightly run and manual dispatch. Catches
      # anything ever committed, without paying for a whole-history scan on
      # every push.
      - name: Gitleaks — full history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact -v --exit-code 1

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Was 20, which the runner reported as deprecated and which is below
          # what @supabase/* now asks for (EBADENGINE, node >=22).
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production deps
        run: npm audit --omit=dev
